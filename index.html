<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLW</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#0d0d11] min-h-screen items-center justify-center flex">
    <div
      class="bg-[#0e0e1f] p-5 border-2 border-[#1a1a2e] rounded-xl flex flex-col items-center gap-4"
    >
      <img
        class="w-50 object-contain"
        src="https://i.imgur.com/P5sK4iz.png"
        alt="logo"
      />

      <button
        onclick="joinServer()"
        class="relative overflow-hidden bg-[#1a1a2e] text-white px-4 py-2 rounded-md hover:bg-[#2a2a3e] transition-all duration-300 w-full cursor-pointer group"
      >
        <span
          class="block transition-all duration-300 group-hover:opacity-0 group-hover:-translate-y-2"
        >
          Войти на FLW
        </span>

        <span
          class="absolute inset-0 flex items-center justify-center opacity-0 translate-y-2 transition-all duration-300 group-hover:opacity-100 group-hover:translate-y-0"
        >
          Заходи заебал!
        </span>
      </button>

      <script>
        function joinServer() {
          if (typeof fancymenu === "undefined") {
            console.warn("FancyMenu API not ready");
            return;
          }

          fancymenu.actions.executeWithCallback(
            "joinserver",
            "play.flwserver.ru:25565", // <-- ТВОЙ IP
            () => console.log("Connecting..."),
            (err) => console.error("Connection failed:", err),
          );
        }
      </script>
    </div>
  </body>
</html>
